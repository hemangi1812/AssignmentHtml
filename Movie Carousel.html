<div id="movieCarousel" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel" style="max-width: 800px; margin: auto;">
  <!-- Indicators -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  
  <!-- Carousel Items -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://via.placeholder.com/800x400/111/fff?text=Movie+Banner+1" class="d-block w-100" alt="Movie 1">
      <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-75 rounded p-2">
        <h5>Epic Adventure: The Journey</h5>
        <p class="small mb-1">Action • Sci-Fi • 2h 45m</p>
        <button class="btn btn-danger btn-sm">Book Tickets</button>
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://via.placeholder.com/800x400/222/fff?text=Movie+Banner+2" class="d-block w-100" alt="Movie 2">
      <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-75 rounded p-2">
        <h5>Mystery of the Lost Kingdom</h5>
        <p class="small mb-1">Mystery • Thriller • 2h 10m</p>
        <button class="btn btn-danger btn-sm">Book Tickets</button>
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://via.placeholder.com/800x400/333/fff?text=Movie+Banner+3" class="d-block w-100" alt="Movie 3">
      <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-75 rounded p-2">
        <h5>Comedy Night Live</h5>
        <p class="small mb-1">Comedy • Romance • 1h 55m</p>
        <button class="btn btn-danger btn-sm">Book Tickets</button>
      </div>
    </div>
  </div>
  
  <!-- Controls -->
  <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
