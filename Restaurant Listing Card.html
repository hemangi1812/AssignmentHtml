<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Card</title>
</head>
<body>

    <article class="restaurant-card">
        <!-- Header: Name & Cuisine -->
        <header>
            <h2>Spice Symphony</h2>
            <p>North Indian, Chinese, Biryani • ₹400 for two</p>
        </header>

        <!-- Main Content: Image & Promo -->
        <div>
            <img src="https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&w=400&q=80" 
                 alt="Delicious Biryani" width="300">
            <p>50% OFF up to ₹100 on select items</p>
        </div>

        <!-- Footer: Ratings & Delivery Info -->
        <footer>
            <span>⭐ 4.4 / 5 (1,240 ratings)</span>
            <span> | </span>
            <span>🕒 32 mins</span>
        </footer>
    </article>

</body>
</html>
