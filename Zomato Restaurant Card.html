<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zomato Restaurant Card</title>
    <style>
        .restaurant-card {
            /* Box Model Properties */
            width: 300px;
            padding: 20px;            /* Space inside the border */
            border: 2px solid #e23744;  /* Zomato red border */
            margin: 30px auto;        /* Space outside the card, centered horizontally */
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
        }

        .restaurant-card h2 {
            margin: 0 0 8px 0;
            color: #1c1c1c;
        }

        .restaurant-card p {
            margin: 0 0 12px 0;
            color: #696969;
            font-size: 14px;
        }

        .rating-badge {
            background-color: #24963f;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="restaurant-card">
        <h2>Spice Symphony</h2>
        <p>North Indian, Chinese, Fast Food</p>
        <span class="rating-badge">⭐ 4.5 / 5</span>
    </div>

</body>
</html>
