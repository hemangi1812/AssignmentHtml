<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Restaurant Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">

    <div class="container py-5">
        <h2 class="mb-4 text-danger fw-bold">Trending Restaurants Near You</h2>
        
        <div class="row g-4">
            <!-- Restaurant 1 -->
            <div class="col-6">
                <div class="card p-3 border-0 shadow-sm h-100">
                    <h4 class="card-title text-dark">Spice Symphony</h4>
                    <p class="card-text text-muted mb-2">North Indian, Chinese, Biryani • ₹400 for two</p>
                    <span class="badge bg-success w-25 text-center">⭐ 4.5 / 5</span>
                </div>
            </div>

            <!-- Restaurant 2 -->
            <div class="col-6">
                <div class="card p-3 border-0 shadow-sm h-100">
                    <h4 class="card-title text-dark">The Pasta House</h4>
                    <p class="card-text text-muted mb-2">Italian, Continental, Wood-fired Pizza • ₹600 for two</p>
                    <span class="badge bg-success w-25 text-center">⭐ 4.3 / 5</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
