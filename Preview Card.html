<div class="card shadow-sm border-0" style="width: 18rem;">
  <!-- Product Image -->
  <div class="position-relative bg-light text-center p-3">
    <span class="position-absolute top-0 start-0 badge bg-success m-2">Best Seller</span>
    <img src="https://via.placeholder.com/200x200?text=Smartphone" class="card-img-top img-fluid" alt="Product Image" style="height: 200px; object-fit: contain;">
  </div>
  
  <!-- Card Body -->
  <div class="card-body">
    <h6 class="card-title text-truncate text-dark mb-1">Ultra HD Smart LED Phone 128GB</h6>

      <span class="badge bg-success text-white small">4.3 <i class="bi bi-star-fill"></i></span>
      <span class="text-muted small">(2,450 ratings)</span>
    </div>
    
    <!-- Price Section -->
    <div class="d-flex align-items-baseline gap-2 mb-3">
      <span class="fs-5 fw-bold text-dark">₹14,999</span>
      <span class="text-muted text-decoration-line-through small">₹21,999</span>
      <span class="text-success small fw-semibold">31% off</span>
    </div>
    
    <!-- Buy Now Button -->
    <button class="btn btn-warning w-100 fw-bold text-dark shadow-sm">
      <i class="bi bi-lightning-fill me-1"></i> Buy Now
    </button>
  </div>
</div>
