<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow - Movie Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <div class="container py-5">
        <div class="row align-items-center bg-secondary bg-opacity-10 p-4 rounded-4 shadow">
            <!-- Poster Column -->
            <div class="col-md-4 mb-4 mb-md-0 text-center">
                <img src="https://via.placeholder.com/250x360" class="img-fluid rounded shadow" alt="Movie Poster">
            </div>

            <!-- Details Column -->
            <div class="col-md-8">
                <h1 class="fw-bold mb-3">Devara: Part 1</h1>
                <p class="text-warning mb-2">⭐ 4.5 / 5 (150K Votes)</p>
                <p class="badge bg-danger text-uppercase mb-3">Action / Drama / Thriller</p>
                <p class="text-light mb-4">
                    An epic action-drama set in the coastal lands, revolving around a fearless hero who battles the forces of evil to protect his people.
                </p>
                <button class="btn btn-danger btn-lg px-4 fw-bold">Book Tickets</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
