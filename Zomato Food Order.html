<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Food Order Form</title>
</head>
<body>

    <h2>Place Your Food Order</h2>

    <form action="#" method="POST">
        <!-- Task 5: Disabled Order ID Field -->
        <!-- 
            WHY THIS FIELD IS DISABLED FOR THE USER:
            The Order ID is a system-generated unique reference key for database tracking.
            Disabling it prevents users from altering or editing the unique transaction identifier,
            ensuring data integrity while keeping it visually clear to the user.
        -->
        <div>
            <label for="orderId">Order ID:</label><br>
            <input type="text" id="orderId" name="orderId" value="ORD12345" disabled>
        </div>
        <br>

        <!-- User Name -->
        <div>
            <label for="customerName">Full Name:</label><br>
            <input type="text" id="customerName" name="customerName" placeholder="Enter your name" required>
        </div>
        <br>

        <!-- Food Item Dropdown -->
        <div>
            <label for="foodItem">Select Food Item:</label><br>
            <select id="foodItem" name="foodItem" required>
                <option value="" disabled selected hidden>-- Select an item --</option>
                <option value="paneer_butter_masala">Paneer Butter Masala</option>
                <option value="veg_biryani">Hyderabadi Veg Biryani</option>
                <option value="butter_naan">Garlic Butter Naan</option>
                <option value="cheese_pizza">Classic Cheese Pizza</option>
            </select>
        </div>
        <br>

        <!-- Quantity -->
        <div>
            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" name="quantity" min="1" max="20" value="1" required>
        </div>
        <br>

        <!-- Delivery Instructions -->
        <div>
            <label for="instructions">Delivery Instructions:</label><br>
            <textarea id="instructions" name="instructions" rows="4" cols="40" 
                      placeholder="E.g., Leave at the door, call upon arrival, extra spicy..." required></textarea>
        </div>
        <br>

        <!-- Submit Order -->
        <button type="submit">Place Order</button>
    </form>

</body>
</html>
