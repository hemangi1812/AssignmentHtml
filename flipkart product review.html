<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Review</title>
</head>
<body>

    <h2>Write a Product Review</h2>

    <form action="#" method="POST">
        <!-- Username Field -->
        <div>
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" placeholder="Enter your full name" required>
        </div>
        <br>

        <!-- Rating Dropdown -->
        <div>
            <label for="rating">Rating:</label><br>
            <select id="rating" name="rating" required>
                <option value="" disabled selected hidden>-- Choose a rating --</option>
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>
        </div>
        <br>

        <!-- Review Message Textarea -->
        <div>
            <label for="review">Review Message:</label><br>
            <textarea id="review" name="review" rows="5" cols="40" 
                      placeholder="Write your review here (at least 20 characters)..." 
                      minlength="20" required></textarea>
        </div>
        <br>

        <!-- Submit Button -->
        <button type="submit">Submit Review</button>
    </form>

</body>
</html>
