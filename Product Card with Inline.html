<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Product Card</title>
</head>
<body>

    <div style="border: 1px solid #ccc; padding: 16px; width: 250px; font-family: Arial, sans-serif;">
        <img src="https://via.placeholder.com/200" alt="Product Image" style="width: 100%;">
        
        <!-- Inline CSS applied to product title only -->
        <h2 style="background-color: #ffe5e5; font-size: 18px; padding: 6px;">
            Wireless Bluetooth Earbuds
        </h2>
        
        <p><strong>₹1,299</strong> <del>₹2,999</del></p>
        <button>Add to Cart</button>
    </div>

</body>
</html>
