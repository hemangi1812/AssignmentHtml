<div class="d-flex flex-wrap gap-2 align-items-center">
  <button type="button" class="btn btn-outline-danger rounded-pill px-4 active fw-semibold" onclick="setActiveFilter(this)">All</button>
  <button type="button" class="btn btn-outline-danger rounded-pill px-4 fw-semibold" onclick="setActiveFilter(this)">Veg</button>
  <button type="button" class="btn btn-outline-danger rounded-pill px-4 fw-semibold" onclick="setActiveFilter(this)">Non-Veg</button>
  <button type="button" class="btn btn-outline-danger rounded-pill px-4 fw-semibold" onclick="setActiveFilter(this)">Desserts</button>
</div>

<!-- Optional Helper Script to handle click-switching behavior -->
<script>
  function setActiveFilter(button) {
    // Remove 'active' from all siblings in the container
    const parent = button.parentElement;
    parent.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
    // Add 'active' to the clicked button
    button.classList.add('active');
  }
</script>
